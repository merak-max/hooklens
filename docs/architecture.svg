<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">HookLens architecture</title>
  <desc id="desc">Webhook senders call an Express capture API. Events are saved in a file store and streamed to the React inspector with server-sent events. Guarded replay sends an event to an allowlisted destination.</desc>
  <rect width="1120" height="360" rx="24" fill="#08100e"/>
  <g font-family="Arial, sans-serif">
    <text x="55" y="55" fill="#8ff0bd" font-size="14" letter-spacing="2">HOOKLENS REQUEST FLOW</text>
    <g fill="#101c19" stroke="#355148" stroke-width="2">
      <rect x="55" y="110" width="200" height="130" rx="12"/>
      <rect x="330" y="85" width="245" height="180" rx="12"/>
      <rect x="650" y="110" width="200" height="130" rx="12"/>
      <rect x="925" y="110" width="140" height="130" rx="12"/>
    </g>
    <g fill="#f3efe5" font-size="20" font-weight="700">
      <text x="91" y="164">Webhook sender</text>
      <text x="377" y="145">Express API</text>
      <text x="692" y="164">JSON store</text>
      <text x="953" y="164">React UI</text>
    </g>
    <g fill="#82938d" font-size="13">
      <text x="90" y="192">POST /hook/:key</text>
      <text x="377" y="178">capture · verify · filter</text>
      <text x="377" y="202">SSE · guarded replay</text>
      <text x="692" y="192">atomic writes</text>
      <text x="953" y="192">inspect</text>
    </g>
    <g stroke="#8ff0bd" stroke-width="3" fill="none">
      <path d="M255 175h67"/><path d="m313 166 9 9-9 9"/>
      <path d="M575 175h67"/><path d="m633 166 9 9-9 9"/>
      <path d="M850 175h67"/><path d="m908 166 9 9-9 9"/>
    </g>
    <path d="M975 248v45H445v-20" stroke="#d7a968" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
    <text x="680" y="318" fill="#d7a968" font-size="12" letter-spacing="1">REPLAY TO ALLOWLISTED HOST</text>
  </g>
</svg>
